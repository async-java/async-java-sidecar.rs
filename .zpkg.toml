[package]
org = "async-java"
name = "async-java-sidecar"
version = "0.1.0"
description = "k8s sidecar for async-java."
license = "MIT"
keywords = ["sidecar", "observability", "k8s"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/async-java/async-java-sidecar.rs"

[dependencies]
"ores-otel/ores-otel-sidecar" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin async-java-sidecar"
outputs = ["target/release/async-java-sidecar"]

[bin]
async-java-sidecar = "target/release/async-java-sidecar"

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
